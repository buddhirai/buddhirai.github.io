<!-- start For Display button on Hover for the buttons on My Daily Journals and/or UH News etc -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
.button {
  /* padding: 15px 25px; */
  padding: 5px 10px;
  font-size: 24px;
  text-align: center;
  line-height: 10px;    /* this moves the text up or down the line */
  cursor: pointer;
  outline: none;
  color: #ffffffff;
  background-color: #6b90f7ea;
  border: none;
  border-radius: 10px;
  /* box-shadow: 0 9px #999; */

/* CSS styles to increase space between button tabs */
margin-right: 10px; /* Adjust the margin to increase the space between buttons */


}


.button:hover {background-color: #3e8e41}

.button:active {
  background-color: #3e8e41;
  /* box-shadow: 0 5px #666; */
  transform: translateY(4px);
}
</style>
<!-- end For Display button on Hover the UH News -->



<!-- for a blinking button  -->
<style>
    /* Basic styling for the link button */
    .blink-button {
        display: inline-block;
        /* padding: 6px 15px; */
        font-size: 18px;
        font-family: Comic Sans MS;
        text-decoration: none;
        color: white;
        background-color: #007bff;
        /* border: none; */
        border:2px solid #007bff;     /* boarder size & boarder color */
        /* border-radius: 5px;  */
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.1s ease;
        animation: blink 10s infinite; /* Adding the blinking animation */
    }

    /* Blinking animation */
    @keyframes blink {
        100% {
            opacity: 0.5;
        }
    }
</style>
