<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buddhi Rai | Physics | University of Hawaiʻi Maui College</title>

    <meta name="description"
          content="Buddhi Rai is an Associate Professor of Physics at the University of Hawaiʻi Maui College. Academic website featuring teaching, physics education, research, student mentoring, STEM projects, publications, and professional activities.">

    <link rel="canonical" href="https://buddhirai.com/">

    <!-- Structured data for Buddhi Rai -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfilePage",
      "mainEntity": {
        "@type": "Person",
        "name": "Buddhi Rai",
        "url": "https://buddhirai.com/",
        "jobTitle": "Associate Professor of Physics",
        "affiliation": {
          "@type": "CollegeOrUniversity",
          "name": "University of Hawaiʻi Maui College"
        }
      }
    }
    </script>

    <!-- Structured data for the website -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Buddhi Rai",
      "alternateName": "Buddhi Rai Academic Website",
      "url": "https://buddhirai.com/"
    }
    </script>

    <style>

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .site-container {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* LEFT NAVIGATION - DESKTOP/LAPTOP */
        .navigation {
            width: 360px;
            min-width: 360px;
            height: 100vh;
            border: none;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            height: 100vh;
            border: none;
        }

        /* Mobile menu button is hidden on computers */
        .menu-button {
            display: none;
        }

        /* Dark transparent background behind open mobile menu */
        .menu-overlay {
            display: none;
        }


        /* Search-engine-readable information about the homepage */
        .site-information {
            position: absolute;
            left: -10000px;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }


        /* ======================================================
                    CELL PHONE / SMALL SCREEN
           ====================================================== */

        @media (max-width: 700px) {

            /*
              Navigation is moved outside the left side
              of the phone screen until Menu is pressed.
            */
            .navigation {
                position: fixed;
                top: 0;
                left: -360px;

                width: 360px;
                min-width: 360px;
                max-width: 90vw;

                height: 100vh;

                background: white;

                z-index: 1001;

                transition: left 0.30s ease;
            }


            /* Navigation slides onto the screen */
            .navigation.open {
                left: 0;
            }


            /*
              Main content receives the entire phone screen.
            */
            .main-content {
                width: 100%;
                min-width: 100%;
                height: 100vh;
            }


            /*
              Small Menu button.
            */
            .menu-button {
                display: block;

                position: fixed;
                top: 8px;
                left: 8px;

                z-index: 1003;

                padding: 7px 11px;

                font-family: Arial, sans-serif;
                font-size: 16px;

                color: white;
                background: #3f66c4;

                border: none;
                border-radius: 8px;

                cursor: pointer;

                box-shadow: 1px 1px 5px rgba(0,0,0,0.35);
            }


            /*
              Transparent dark area appears behind
              navigation when menu is open.
            */
            .menu-overlay {
                display: none;

                position: fixed;

                top: 0;
                left: 0;

                width: 100%;
                height: 100%;

                background: rgba(0,0,0,0.25);

                z-index: 1000;
            }


            .menu-overlay.show {
                display: block;
            }

        }

    </style>

</head>


<body>


    <!--
       Basic information about this website is part of index.html itself.
    -->

    <div class="site-information">

        <h1>Buddhi Rai</h1>

        <p>
            Buddhi Rai is an Associate Professor of Physics at the
            University of Hawaiʻi Maui College. His academic work includes
            physics teaching, physics education, student research,
            STEM education, research, mentoring, and professional activities.
        </p>

        <p>
            This is the academic website of Buddhi Rai.
        </p>

    </div>



    <!-- MOBILE MENU BUTTON -->

    <button
        class="menu-button"
        id="menuButton"
        onclick="toggleMenu()">
        ☰ Menu
    </button>



    <!-- MOBILE BACKGROUND OVERLAY -->

    <div
        class="menu-overlay"
        id="menuOverlay"
        onclick="closeMenu()">
    </div>



    <div class="site-container">


        <!-- Existing left navigation page -->

        <iframe
            class="navigation"
            id="navigation"
            src="mycontents.html"
            title="Buddhi Rai Website Navigation">
        </iframe>



        <!-- Existing main homepage -->

        <iframe
            class="main-content"
            src="mainpage_wrapper_scroll.html"
            name="showframe"
            title="Buddhi Rai Academic Homepage">
        </iframe>


    </div>



    <script>

        function toggleMenu() {

            const navigation =
                document.getElementById("navigation");

            const overlay =
                document.getElementById("menuOverlay");

            const button =
                document.getElementById("menuButton");


            navigation.classList.toggle("open");
            overlay.classList.toggle("show");


            if (navigation.classList.contains("open")) {

                button.innerHTML = "✕ Close";

            } else {

                button.innerHTML = "☰ Menu";

            }

        }



        function closeMenu() {

            const navigation =
                document.getElementById("navigation");

            const overlay =
                document.getElementById("menuOverlay");

            const button =
                document.getElementById("menuButton");


            navigation.classList.remove("open");
            overlay.classList.remove("show");

            button.innerHTML = "☰ Menu";

        }

    </script>


</body>

</html>
