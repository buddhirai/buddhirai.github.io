<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newton</title>
<style>
  /* Basic styling for the page */
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 0;
  }

  /* Container for updates */
  .updates-container {
    width: 95%;
    margin: 20px auto;
    padding: 20px;
    background-color: #ffffff;
    border-radius: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    border: 2px solid #333;   /* Adds a visible border. I added this line. */
  }

  /* Header styling */
  h1 {
    text-align: center;
    color: #333;
  }





/* =========================================================
   MOBILE PHONE DISPLAY
   Keeps desktop/laptop appearance unchanged
   ========================================================= */

@media screen and (max-width: 700px) {

  .updates-container {
    width: calc(100% - 10px);
    margin: 5px;
    padding: 10px;
    box-sizing: border-box;
  }

  h1 {
    font-size: 1.5em;
    line-height: 1.25;
    margin: 10px 5px 15px;
  }

  table {
    width: 100%;
    max-width: 100%;
  }

  td {
    padding: 5px;
    text-align: center;
  }

  img {
    display: block;
    width: auto;
    max-width: 100%;
    height: auto;
    margin: 0 auto;
    box-sizing: border-box;
  }

}



  

</style>





</head>






<body>
    
<div class="updates-container">




   
    

<table align="center" cellpadding="10">
<center>
  
<h1>The Greatest Mind in all of Humanity!</h1>

<tr>      
    <td>
    <img src=pictures/newton1.jpg width="950" height="auto" border="5">
    </td>   
</tr> 
    
<tr>      
    <td>
    <img src=pictures/newton2.jpg width="auto" height="auto" border="0">
    </td>          
</tr>

</center>
</table>


  
</div>

</body>
</html>
